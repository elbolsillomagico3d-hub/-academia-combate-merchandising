:root{

    --green-light:#2f650d;
    --cream:#f7f6f0;
    --white:#fff;
    --text:#20251d;
    --muted:#687062;
    --line:#dfe3d8;
    --shadow:0 18px 45px rgba(20,40,10,.12);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
    line-height:1.5;
}

/* =========================
   CABECERA
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:linear-gradient(
        135deg,
        #102900 0%,
        #234c08 45%,
        #122b02 100%
    );
    color:white;
    border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 5px 25px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
        0 5px 18px rgba(0,0,0,.25),
        inset 0 0 15px rgba(255,255,255,.04);
}

.brand-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-text strong{
    display:block;
    font-size:16px;
    letter-spacing:.4px;
}

.brand-text span{
    display:block;
    font-size:11px;
    opacity:.72;
}

.cart-button{
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);
    color:white;
    border-radius:14px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:700;
}

/* =========================
   MENÚ
========================= */

nav{
    background:var(--green-dark);
}

.nav-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    padding:12px 18px;
    font-size:14px;
    font-weight:700;
    transition:.2s;
}

nav a:hover{
    background:var(--green-light);
}

/* =========================
   HERO / LOGO
========================= */

.hero{
    position:relative;
    width:100%;
    overflow:hidden;
    text-align:center;
    padding:8px 8px 45px;
    background:
        radial-gradient(
            circle at center,
            #315f13 0%,
            #183c05 48%,
            #081700 100%
        );
    color:white;
}

.hero-content{
    width:100%;
    max-width:none;
    margin:auto;
}

.hero-logo{
    display:block;
    width:96vw;
    max-width:none;
    height:auto;
    object-fit:contain;
    margin:-2px auto 10px;
    filter:
        drop-shadow(0 20px 30px rgba(0,0,0,.40))
        drop-shadow(0 0 35px rgba(167,185,111,.12));
}

.hero h1{
    font-size:clamp(30px,6vw,58px);
    line-height:1;
    margin-bottom:15px;
    text-shadow:0 4px 15px rgba(0,0,0,.35);
}

.hero p{
    max-width:700px;
    margin:auto;
    color:rgba(255,255,255,.82);
    font-size:17px;
}

/* =========================
   CONTENIDO
========================= */

.container{
    width:min(1200px,92%);
    margin:auto;
}

.section-title{
    text-align:center;
    margin:55px 0 30px;
}

.section-title h2{
    color:var(--green);
    font-size:clamp(28px,4vw,40px);
    margin-bottom:8px;
}

.section-title p{
    color:var(--muted);
}

/* =========================
   CAMISETAS / SUDADERAS
========================= */

.feature-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
    margin-bottom:50px;
}

.feature-card{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    background:white;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    transition:.25s;
}

.feature-card:hover{
    transform:translateY(-5px);
    box-shadow:0 25px 55px rgba(20,40,10,.18);
}

.feature-image{
    width:100%;
    height:430px;
    background:#e9e9e4;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.feature-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.feature-card:hover .feature-image img{
    transform:scale(1.03);
}

.feature-content{
    padding:24px;
}

.feature-content h3{
    color:var(--green);
    font-size:26px;
    margin-bottom:8px;
}

.feature-content p{
    color:var(--muted);
    margin-bottom:18px;
}

.price{
    font-size:22px;
    font-weight:800;
    color:var(--green);
    margin-bottom:18px;
}

.button{
    display:inline-block;
    background:var(--green);
    color:white;
    text-decoration:none;
    padding:13px 22px;
    border-radius:12px;
    font-weight:700;
    transition:.2s;
}

.button:hover{
    background:var(--green-light);
}

/* =========================
   OTRAS CATEGORÍAS
========================= */

.categories{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    margin-bottom:60px;
}

.category{
    background:white;
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    text-align:center;
    transition:.25s;
}

.category:hover{
    transform:translateY(-4px);
}

.category img{
    width:100%;
    height:230px;
    object-fit:contain;
    margin-bottom:12px;
}

.category h3{
    color:var(--green);
    margin-bottom:8px;
}

.category p{
    color:var(--muted);
    margin-bottom:15px;
}

/* =========================
   FOOTER
========================= */

footer{
    background:var(--green-dark);
    color:white;
    text-align:center;
    padding:35px 20px;
    margin-top:40px;
}

footer p{
    opacity:.75;
    font-size:14px;
}
